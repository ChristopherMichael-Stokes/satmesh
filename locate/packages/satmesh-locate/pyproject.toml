[project]
name = "satmesh-locate"
version = "0.1.0"
description = "Place retrieval for the photo-only first fix: MegaLoc descriptors of rendered views, ranked against a photo."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.5.4",
  "opencv-python-headless>=5.0.0.93",
  "pydantic>=2.14.1",
  "typer>=0.27.3",
]

[project.scripts]
satmesh-locate = "satmesh_locate.cli:app"
satmesh-locate-export = "satmesh_locate.megaloc_export:app"

[project.optional-dependencies]
cpu = ["onnxruntime>=1.31.1"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.31.1"]
tensorrt = ["onnx>=1.23.2", "xfeat-trt"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
xfeat-trt = { path = "../../../third-party/xfeat-rt/backends/tensorrt", editable = true }
