[project]
name = "satmesh-monitor"
version = "0.1.0"
description = "Read-only map viewer for first-fix runs: replays or follows a run's event file over the cached Esri imagery."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.5.4",
  "opencv-python-headless>=5.0.0.93",
  "satmesh-locate",
  "starlette>=1.10.0",
  "typer>=0.27.3",
  "uvicorn>=0.54.0",
]

[project.scripts]
satmesh-monitor = "satmesh_monitor.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
satmesh-locate = { workspace = true }
