[project]
name = "satmesh-height"
version = "0.1.0"
description = "Refines a coarse DSM to 1 m with a guide image: PixTransform, area-to-point kriging and their compositions."
requires-python = ">=3.13"
license-files = ["LICENSE-PixTransform"]
dependencies = [
  "numpy>=2.3.0",
  "pydantic>=2.14.1",
  "rasterio>=1.5.2",
  "scipy>=1.16.0",
  "torch>=2.9.0",
  "typer>=0.27.3",
]

[project.scripts]
satmesh-height = "satmesh_height.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
