[project]
name = "satmesh-data"
version = "0.1.0"
description = "Cached, throttled fetch of Esri World Imagery tiles and EA lidar DTMs; tile mosaics."
requires-python = ">=3.13"
dependencies = [
  "affine>=3.0.1",
  "httpx>=0.28.1",
  "rasterio>=1.5.2",
  "satmesh-core",
  "shapely>=2.2.0",
  "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
satmesh-core = { workspace = true }
