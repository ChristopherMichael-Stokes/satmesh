# Contiguous US as overlapping boxes: an area must fit inside one box, so neighbours overlap by
# at least 0.2 degrees. Borders are approximate: slivers of Canada, Mexico and the Bahamas fall
# inside, and an area there fails at fetch time with no 3DEP data.
[[sources]]
name = "usgs-3dep"
adapter = "tnm_dem_with_ept_dsm"
covers = [
  [-124.8, 32.55, -114.4, 49.0],
  [-114.9, 31.33, -103.0, 49.0],
  [-106.7, 25.84, -93.5, 36.6],
  [-104.1, 36.4, -89.0, 49.4],
  [-94.7, 28.9, -75.0, 37.1],
  [-83.0, 24.4, -79.9, 31.0],
  [-91.0, 36.0, -66.9, 42.0],
  [-90.5, 41.0, -82.4, 47.5],
  [-80.6, 41.0, -73.3, 43.4],
  [-76.4, 43.3, -73.3, 45.02],
  [-73.8, 40.9, -69.9, 45.02],
  [-71.1, 43.0, -66.9, 47.5],
]
xy_crs = "EPSG:6318"
height_crs = "EPSG:6349"
ground_is_surface = false
licence = "USGS 3DEP: public domain, no use limits; credit requested, modifications described"
attribution = "U.S. Geological Survey 3D Elevation Program: 1 m DEM and lidar point clouds; DSM rasterised from first returns by satmesh"
tnm_products_url = "https://tnmaccess.nationalmap.gov/api/v1/products"
tnm_dataset = "Digital Elevation Model (DEM) 1 meter"
image_server_url = "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer"
seamless_path_template = "/vsicurl/https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/{tile}/USGS_13_{tile}.tif"
ept_index_url = "https://raw.githubusercontent.com/hobuinc/usgs-lidar/master/boundaries/resources.geojson"

