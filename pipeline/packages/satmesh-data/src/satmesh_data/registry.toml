# Ordered: the first entry covering the centre of a footprint serves it. `covers` boxes are
# [west, south, east, north] in degrees.

[[sources]]
name = "ea-lidar-composite"
adapter = "ea_wcs"
covers = [[-8.7, 49.8, 1.9, 60.9]]
xy_crs = "EPSG:27700"
height_crs = "EPSG:7405"
ground_is_surface = false
licence = "Open Government Licence v3.0"
attribution = "Contains Environment Agency information © Environment Agency and database right"
dtm_wcs_url = "https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wcs"
dtm_coverage_id = "13787b9a-26a4-4775-8523-806d13af58fc__Lidar_Composite_Elevation_DTM_1m"
dsm_wcs_url = "https://environment.data.gov.uk/spatialdata/lidar-composite-digital-surface-model-first-return-dsm-1m/wcs"
dsm_coverage_id = "df4e3ec3-315e-48aa-aaaf-b5ae74d7b2bb__Lidar_Composite_Elevation_FZ_DSM_1m"

[[sources]]
name = "copernicus-glo30-fabdem"
adapter = "cog_tiles_with_zip_ground"
covers = [[34.0, 12.0, 60.0, 38.0]]
xy_crs = "EPSG:4326"
height_crs = "EPSG:4326+3855"
ground_is_surface = false
licence = "FABDEM CC BY-NC-SA 4.0 (non-commercial); Copernicus DEM licence (free, attribution required)"
attribution = "FABDEM V1-2, Hawker et al. 2022, University of Bristol; CC BY-NC-SA 4.0. Contains modified Copernicus DEM GLO-30 data, DLR e.V. 2010-2014 and Airbus Defence and Space GmbH 2014-2018, provided under COPERNICUS by the European Union and ESA"
url_template = "https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/Copernicus_DSM_COG_10_{ns}{lat:02d}_00_{ew}{lon:03d}_00_DEM/Copernicus_DSM_COG_10_{ns}{lat:02d}_00_{ew}{lon:03d}_00_DEM.tif"
ground_path_template = "/vsizip//vsicurl/https://data.bris.ac.uk/datasets/s5hqmjcdj8yo2ibzi9b4ew3sn/{block}_FABDEM_V1-2.zip/{tile}_FABDEM_V1-2.tif"
