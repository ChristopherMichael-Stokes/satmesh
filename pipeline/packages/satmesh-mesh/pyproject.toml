[project]
name = "satmesh-mesh"
version = "0.1.0"
description = "Textured terrain mesh from a DTM and an imagery raster, exported as georeferenced GLB."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.5.4",
  "pillow>=13.0.0",
  "pydelatin>=0.4.0",
  "satmesh-data",
  "trimesh>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
satmesh-data = { workspace = true }
