[project]
name = "satmesh-track"
version = "0.1.0"
description = "Camera poses and lens calibration recovered from ordered photos against a tile store."
requires-python = ">=3.13"
dependencies = [
  "gtsam>=4.3.0",
  "numpy>=2.5.4",
  "onnxruntime>=1.31.1",
  "opencv-python-headless>=5.0.0.93",
  "satmesh-core",
  "satmesh-eval",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
satmesh-eval = { workspace = true }
satmesh-core = { workspace = true }
