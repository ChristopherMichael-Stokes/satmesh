line-length = 100
target-version = "py313"
src = ["pipeline/packages/*/src", "ml/packages/*/src"]

[lint]
select = ["ALL"]
ignore = [
  # conflict with the formatter
  "COM812",
  "COM819",
  "ISC001",
  # incompatible with D211 / D212, which are kept
  "D203",
  "D213",
  # no copyright headers in this repo
  "CPY001",
  # pandas rules misfire on numpy arrays (.values, .T)
  "PD",
  # TODOs carry no author or issue link: single maintainer, tracked in TODO.md
  "TD002",
  "TD003",
  # TODO comments are allowed
  "FIX002",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "D1", "SLF001", "INP001", "ANN"]
"**/*.ipynb" = ["T201", "D100", "D103", "E402", "INP001", "B018", "ERA001"]
